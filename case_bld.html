<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Anesthesia Sim - Visual Case Builder</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { margin: 0; background: #181a1f; color: #e5e7eb; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { background: #111317; border-bottom: 1px solid #2d3139; padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 16px; color: #facc15; margin-right: auto; }
  button { background: #2d3748; color: #e5e7eb; border: 1px solid #4a5568; border-radius: 5px; padding: 6px 11px; font-size: 12px; cursor: pointer; }
  button:hover { background: #3b475c; border-color: #facc15; }
  button.primary { background: #2563eb; border-color: #3b82f6; color: white; font-weight: 600; }
  button.primary:hover { background: #1d4ed8; }
  button.danger { background: #7f1d1d; border-color: #991b1b; }
  button.danger:hover { background: #991b1b; }
  button.small { padding: 3px 7px; font-size: 11px; }
  input, select, textarea { background: #0f1115; color: #e5e7eb; border: 1px solid #374151; border-radius: 4px; padding: 5px 7px; font-size: 12px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #60a5fa; }
  input[type="checkbox"] { width: auto; }
  label { display: block; font-size: 11px; color: #9ca3af; margin-bottom: 3px; }
  .main { display: grid; grid-template-columns: 270px 1fr 400px; flex: 1; overflow: hidden; }
  .col { overflow-y: auto; padding: 12px; border-right: 1px solid #2d3139; }
  .col:last-child { border-right: none; }
  .card { background: #20232a; border: 1px solid #2f343f; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
  .card h2 { margin: 0 0 8px 0; font-size: 13px; color: #93c5fd; border-bottom: 1px solid #2f343f; padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; }
  .state-item { padding: 7px 9px; border-radius: 5px; border: 1px solid #2f343f; background: #17191e; margin-bottom: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  .state-item.active { border-color: #facc15; background: #262933; }
  .badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 600; }
  .badge.start { background: #1e3a8a; color: #93c5fd; }
  .badge.win { background: #14532d; color: #86efac; }
  .badge.fail { background: #7f1d1d; color: #fca5a5; }
  .tran-card { background: #17191e; border: 1px solid #333945; border-radius: 6px; padding: 9px; margin-bottom: 8px; }
  .cond-row { display: grid; grid-template-columns: 1fr 68px 1fr 24px; gap: 5px; align-items: center; margin-top: 5px; }
  .warn { background: #451a03; border: 1px solid #b45309; color: #fde68a; padding: 6px 8px; border-radius: 4px; font-size: 11px; margin-bottom: 8px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal.open { display: flex; }
  .modal-box { background: #1e2128; border: 1px solid #3f4654; border-radius: 8px; width: 700px; max-width: 92vw; max-height: 85vh; display: flex; flex-direction: column; padding: 14px; gap: 10px; }
  .modal-box textarea { flex: 1; min-height: 300px; font-family: monospace; font-size: 11px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tab { flex: 1; text-align: center; padding: 5px; background: #17191e; border: 1px solid #2f343f; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .tab.active { background: #2563eb; border-color: #3b82f6; color: white; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Anesthesia Sim — Case Builder</h1>
  <button onclick="loadTemplate()">Load GA Template</button>
  <button onclick="openImport()">Import Case JS</button>
  <button onclick="document.getElementById('fileInput').click()">Open .js File</button>
  <input id="fileInput" type="file" accept=".js" style="display:none" onchange="handleFile(event)" />
  <button onclick="openExport()">Preview / Copy JS</button>
  <button class="primary" onclick="downloadCase()">Download Case .js</button>
</header>

<div class="main">
  <!-- LEFT: CASE INFO & STATES -->
  <div class="col">
    <div class="tabs">
      <div class="tab active" id="tabStatesBtn" onclick="switchLeftTab('states')">States</div>
      <div class="tab" id="tabCaseBtn" onclick="switchLeftTab('case')">Case Info</div>
    </div>

    <div id="leftStates">
      <div style="display:flex; gap:6px; margin-bottom:8px;">
        <button class="primary" style="flex:1" onclick="addState()">+ Add State</button>
        <button onclick="duplicateState()">Clone</button>
      </div>
      <div id="stateList"></div>
    </div>

    <div id="leftCase" style="display:none;">
      <div class="card">
        <h2>Case Metadata</h2>
        <div class="grid2">
          <div><label>Case Number</label><input type="number" id="c_num" value="35" min="1" onchange="syncCase()" /></div>
          <div><label>Possible Points</label><input type="number" id="c_points" onchange="syncCase()" /></div>
        </div>
        <div style="margin-top:6px;"><label>Case Title</label><input id="c_title" onchange="syncCase()" /></div>
        <div class="grid3" style="margin-top:6px;">
          <div><label>Weight (kg)</label><input type="number" id="c_lbm" onchange="syncCase()" /></div>
          <div><label>Initial SpO2</label><input type="number" id="c_sat" onchange="syncCase()" /></div>
          <div><label>Image Set (1-10)</label><input type="number" id="c_img" onchange="syncCase()" /></div>
        </div>
        <div class="grid2" style="margin-top:6px;">
          <div><label>Prep (sec)</label><input type="number" id="c_prep" onchange="syncCase()" /></div>
          <div><label>Surgery (sec)</label><input type="number" id="c_surg" onchange="syncCase()" /></div>
        </div>
        <div style="margin-top:6px;"><label>Bad Drugs (comma-separated)</label><input id="c_bad" placeholder="e.g. Succinylcholine, Ketamine" onchange="syncCase()" /></div>
        <div style="margin-top:6px;"><label>PreOp Evaluation</label><textarea id="c_preop" rows="5" onchange="syncCase()"></textarea></div>
        <div style="margin-top:6px;"><label>Learning Objectives</label><textarea id="c_obj" rows="4" onchange="syncCase()"></textarea></div>
        <div style="margin-top:6px;"><label>Debrief Message</label><textarea id="c_debrief" rows="4" onchange="syncCase()"></textarea></div>
      </div>
    </div>
  </div>

  <!-- CENTER: STATE EDITOR -->
  <div class="col" id="stateEditor"></div>

  <!-- RIGHT: TRANSITIONS -->
  <div class="col">
    <div id="warnings"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <strong style="font-size:13px; color:#93c5fd;">Transitions from <span id="tranStateLabel"></span></strong>
      <button class="primary small" onclick="addTransition()">+ Add Transition</button>
    </div>
    <div id="tranList"></div>
  </div>
</div>

<!-- IMPORT / EXPORT MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong id="modalTitle">Export JS</strong>
      <button onclick="closeModal()">Close</button>
    </div>
    <div id="modalHint" style="font-size:11px; color:#9ca3af;"></div>
    <textarea id="modalText"></textarea>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button id="modalActionBtn" class="primary" onclick="modalAction()">Copy</button>
    </div>
  </div>
</div>

<script>
const RHYTHMS = ["Sinus1","Sinus2","Sinus3","Sinus4","Sinus5","Sinus6","St1","St2","St3","Afib6","Vtach3","Vfib2","Asystole1"];
const AIRWAYS = ["nl","restricted","obstructed"];
const DRUGS = ["Adenosine","Albuterol","Alfentanil","Aminophylline","Amiodarone","Ampicillin","Atropine","Beclomethasone","Calcium","Cefazolin","Cefotetan","Cimetidine","Cisatracurium","Dantrolene","Dexamethasone","Dextrose50","Digoxin","Diltiazem","Diphenhydramine","Dobutamine","Dopamine","Doxacurium","Droperidol","Edrophonium","Ephedrine","Epinephrine","Esmolol","Etomidate","Famotidine","Fentanyl","Flumazenil","Furosemide","Gentamicin","Glycopyrrolate","Heparin","Hydralazine","Hydrocortisone","Insulin","Ipratropium","Isoetharine","Ketamine","Ketorolac","Labetalol","Lidocaine","Magnesium","Mannitol","Meperidine","Metaproterenol","Methadone","Methohexital","Methylprednisolone","Metoclopramide","Metoprolol","Midazolam","Milrinone","Mivacurium","Morphine","Naloxone","Neostigmine","Nicardipine","Nifedipine","Nitroglycerin","Nitroprusside","Norepinephrine","Octreotide","Ondansetron","Oxytocin","Pancuronium","Phentolamine","Phenylephrine","Pipecuronium","Procainamide","Propofol","Propranolol","Protamine","Remifentanil","Rocuronium","Scopolamine","SodiumBicarb","SodiumCitrate","Succinylcholine","Sufentanil","Thiopental","Vancomycin","Vasopressin","Vecuronium","Verapamil"];
const NUM_CONDS = ["time","doa","mac","mic","nmb","tFluid","o2Sat","peep","nitrousOxide","halothane","defib","sync"];
const DRUG_CONDS = ["bDrug","iDrug"];
const BOOL_CONDS = ["airwayTube","airwayLma","airwayCrico","tubeTrachea","tubeEsoph","tubeAbove","tubeMainstem","tryLaryTube","tryFo","tryLma","checkTube","adjustHead","oralAirway","nasalAirway","doingCricoid","suction","checkCircuit","makeIncision","doingSurgery","chestTube","floodField","aspirateCvp","doingCpr","level","trend","revTrend","warmIv","warmBlanket","icedIv","icePack","icedLavage"];

function defaultState(name="NEW_STATE") {
  return {
    name, whatNextMsg: "Monitor and manage the patient.", airwayStr: "nl",
    aspirateCvpMsg: "10 mL blood was aspirated from the CVP catheter.",
    baseAbpS: 125, baseAbpD: 75, baseAbpM: 92, baseHr: 80, spRate: 80, spSignal: 3,
    rhythm: "Sinus1", stSegII: 0.0, stSegV5: 0.0, cardiacOutput: 5.0,
    cvp: 8, papS: 24, papD: 10, papM: 15, papW: 8,
    spontRr: 14, spontTv: 500, contPip: 24, sat20: 93, sat40: 97, sat100: 99,
    laryTubeSuccess: 1, lmaSuccessFlag: true, sputumAmount: 0, hiCo2ProdFlag: false,
    temperature: 36.8, hct: 40, sodium: 140, basePot: 4.2, baseBicarb: 24.0, glucose: 110,
    rateEbl: 5, rateUo: 1.5, overdoseFlag: true, finalState: 0,
    recordMsg: "Patient status updated.",
    mentalStatusMsg: "The patient is unresponsive.", pupilsMsg: "The pupils are small and reactive.",
    lidReflexMsg: "The lid reflex is absent.", breathSoundsMsg: "The breath sounds are clear bilaterally.",
    heartSoundsMsg: "Regular rate and rhythm, without murmurs.", pulseMsg: "The pulse is strong and regular.",
    skinMsg: "The skin is warm and dry with normal capillary refill.",
    trans: []
  };
}

let caseNum = 35;
let currentCase = null;
let selIdx = 0;
let modalMode = "export";

function loadTemplate() {
  caseNum = 35;
  currentCase = {
    title: "Case 35 - Custom General Anesthesia Case",
    badDrugs: [], badDrugScore: 50, coMin: 1.2,
    depthCarina: 25, depthCords: 18, depthTubeInitial: 22,
    durationPrep: 45, durationSurgery: 900, helpFlag: true,
    imageSet: 5, initialSat: 98, leanBodyMass: 75,
    possiblePoints: 600, volAnDsp: 80,
    preopMsg: "55 year old (75 kg) for elective procedure.\n\nPMH: Well controlled.\nExam: HR 82, BP 130/78, SpO2 98% RA.\nAirway: Mallampati 1, good mouth opening.",
    learningObj: "1. Preoxygenate and induce anesthesia smoothly.\n2. Secure airway and maintain hemodynamics.",
    debriefMsg: "Preoxygenate, induce with IV anesthetic, paralyze, intubate, and maintain anesthesia during surgery.",
    states: [
      Object.assign(defaultState("AWAKE"), {
        whatNextMsg: "Preoxygenate and induce general anesthesia.",
        mentalStatusMsg: "The patient is awake and responds to voice commands.",
        lidReflexMsg: "The lid reflex is present.",
        recordMsg: "Awake and awaiting induction.",
        laryTubeSuccess: 0, lmaSuccessFlag: false,
        trans: [
          { nextState: "INDUCED", comment: "Patient induced smoothly. (+100 points)", points: 100, conditions: [{ type: "doa", op: "GT", value: 0.6 }] }
        ]
      }),
      Object.assign(defaultState("INDUCED"), {
        whatNextMsg: "Administer muscle relaxant and secure the airway.",
        baseHr: 76, spRate: 76, baseAbpS: 112, baseAbpD: 68, baseAbpM: 83,
        spontRr: 6, spontTv: 300, recordMsg: "Anesthetized, airway not yet secured.",
        trans: [
          { nextState: "INTUBATED", comment: "Airway secured with ETT. (+200 points)", points: 200, conditions: [{ type: "tubeTrachea", value: true }] }
        ]
      }),
      Object.assign(defaultState("INTUBATED"), {
        whatNextMsg: "Deepen anesthetic and tell surgeon to prep/incise.",
        baseHr: 74, spRate: 74, baseAbpS: 118, baseAbpD: 70, baseAbpM: 86,
        spontRr: 0, spontTv: 0, recordMsg: "Intubated, ready for surgery.",
        trans: [
          { nextState: "MAINTENANCE", comment: "Surgery started at adequate depth. (+300 points)", points: 300, conditions: [{ type: "makeIncision", value: true }, { type: "doa", op: "GT", value: 1.0 }] }
        ]
      }),
      Object.assign(defaultState("MAINTENANCE"), {
        whatNextMsg: "Maintain anesthesia and monitor vitals.",
        baseHr: 70, spRate: 70, baseAbpS: 110, baseAbpD: 65, baseAbpM: 80,
        spontRr: 0, spontTv: 0, finalState: 1, recordMsg: "Maintenance of anesthesia.",
        trans: []
      })
    ]
  };
  selIdx = 0;
  renderAll();
}

function switchLeftTab(tab) {
  document.getElementById("leftStates").style.display = tab === "states" ? "block" : "none";
  document.getElementById("leftCase").style.display = tab === "case" ? "block" : "none";
  document.getElementById("tabStatesBtn").classList.toggle("active", tab === "states");
  document.getElementById("tabCaseBtn").classList.toggle("active", tab === "case");
}

function renderCaseMeta() {
  document.getElementById("c_num").value = caseNum;
  document.getElementById("c_title").value = currentCase.title || "";
  document.getElementById("c_points").value = currentCase.possiblePoints || 1000;
  document.getElementById("c_lbm").value = currentCase.leanBodyMass || 70;
  document.getElementById("c_sat").value = currentCase.initialSat || 98;
  document.getElementById("c_img").value = currentCase.imageSet || 5;
  document.getElementById("c_prep").value = currentCase.durationPrep || 45;
  document.getElementById("c_surg").value = currentCase.durationSurgery || 1200;
  document.getElementById("c_bad").value = (currentCase.badDrugs || []).join(", ");
  document.getElementById("c_preop").value = currentCase.preopMsg || "";
  document.getElementById("c_obj").value = currentCase.learningObj || "";
  document.getElementById("c_debrief").value = currentCase.debriefMsg || "";
}

function syncCase() {
  caseNum = parseInt(document.getElementById("c_num").value) || 35;
  currentCase.title = document.getElementById("c_title").value;
  currentCase.possiblePoints = parseInt(document.getElementById("c_points").value) || 1000;
  currentCase.leanBodyMass = parseFloat(document.getElementById("c_lbm").value) || 70;
  currentCase.initialSat = parseFloat(document.getElementById("c_sat").value) || 98;
  currentCase.imageSet = parseInt(document.getElementById("c_img").value) || 5;
  currentCase.durationPrep = parseInt(document.getElementById("c_prep").value) || 45;
  currentCase.durationSurgery = parseInt(document.getElementById("c_surg").value) || 1200;
  currentCase.badDrugs = document.getElementById("c_bad").value.split(",").map(s => s.trim()).filter(Boolean);
  currentCase.preopMsg = document.getElementById("c_preop").value;
  currentCase.learningObj = document.getElementById("c_obj").value;
  currentCase.debriefMsg = document.getElementById("c_debrief").value;
}

function renderStateList() {
  const el = document.getElementById("stateList");
  el.innerHTML = "";
  currentCase.states.forEach((st, i) => {
    const div = document.createElement("div");
    div.className = "state-item" + (i === selIdx ? " active" : "");
    div.onclick = () => { selIdx = i; renderAll(); };
    let badge = "";
    if (i === 0) badge = '<span class="badge start">START</span>';
    else if (st.finalState === 1) badge = '<span class="badge win">FINAL +1</span>';
    else if (st.finalState < 0) badge = `<span class="badge fail">FAIL ${st.finalState}</span>`;
    div.innerHTML = `<span><b>${st.name}</b> <small style="color:#6b7280">(${(st.trans||[]).length}t)</small></span>${badge}`;
    el.appendChild(div);
  });
}

function addState() {
  const name = "STATE_" + (currentCase.states.length + 1);
  currentCase.states.push(defaultState(name));
  selIdx = currentCase.states.length - 1;
  renderAll();
}

function duplicateState() {
  const copy = JSON.parse(JSON.stringify(currentCase.states[selIdx]));
  copy.name = copy.name + "_COPY";
  currentCase.states.splice(selIdx + 1, 0, copy);
  selIdx++;
  renderAll();
}

function deleteState() {
  if (currentCase.states.length <= 1) return alert("Case needs at least 1 state.");
  currentCase.states.splice(selIdx, 1);
  if (selIdx >= currentCase.states.length) selIdx = currentCase.states.length - 1;
  renderAll();
}

function moveState(dir) {
  const ni = selIdx + dir;
  if (ni < 0 || ni >= currentCase.states.length) return;
  const tmp = currentCase.states[selIdx];
  currentCase.states[selIdx] = currentCase.states[ni];
  currentCase.states[ni] = tmp;
  selIdx = ni;
  renderAll();
}

function field(labelTxt, key, type="text", extra="") {
  const st = currentCase.states[selIdx];
  const val = st[key] !== undefined ? st[key] : "";
  if (type === "checkbox") {
    return `<div style="display:flex;align-items:center;gap:6px;margin-top:14px;"><input type="checkbox" ${val ? "checked" : ""} onchange="upd('${key}', this.checked)"><label style="margin:0">${labelTxt}</label></div>`;
  }
  return `<div><label>${labelTxt}</label><input type="${type}" ${extra} value="${String(val).replace(/"/g, "&quot;")}" onchange="upd('${key}', ${type==='number'?'parseFloat(this.value)||0':'this.value'})"></div>`;
}

function selField(labelTxt, key, opts) {
  const st = currentCase.states[selIdx];
  const optionsHtml = opts.map(o => {
    const v = typeof o === "object" ? o.v : o;
    const t = typeof o === "object" ? o.t : o;
    return `<option value="${v}" ${st[key] == v ? "selected" : ""}>${t}</option>`;
  }).join("");
  const isNum = typeof (typeof opts[0] === "object" ? opts[0].v : opts[0]) === "number";
  return `<div><label>${labelTxt}</label><select onchange="upd('${key}', ${isNum ? 'parseInt(this.value)' : 'this.value'})">${optionsHtml}</select></div>`;
}

function upd(key, val) {
  currentCase.states[selIdx][key] = val;
  if (key === "name" || key === "finalState") { renderStateList(); renderTransitions(); renderWarnings(); }
}

function renderStateEditor() {
  const st = currentCase.states[selIdx];
  document.getElementById("stateEditor").innerHTML = `
    <div class="card">
      <h2>
        <span>State: ${st.name}</span>
        <span style="display:flex;gap:4px;">
          <button class="small" onclick="moveState(-1)">▲</button>
          <button class="small" onclick="moveState(1)">▼</button>
          <button class="small danger" onclick="deleteState()">Delete</button>
        </span>
      </h2>
      <div class="grid3">
        ${field("State Name (UPPERCASE)", "name")}
        ${selField("Final State", "finalState", [{v:0,t:"0 - Active"},{v:1,t:"1 - Success (Win)"},{v:-1,t:"-1 - Fail (Survived)"},{v:-2,t:"-2 - Fail (Died)"}])}
        ${field("Overdose Checks On", "overdoseFlag", "checkbox")}
      </div>
      <div style="margin-top:6px;">${field("What Now? (Help Hint)", "whatNextMsg")}</div>
      <div style="margin-top:6px;">${field("Case Log Header (recordMsg)", "recordMsg")}</div>
    </div>

    <div class="card">
      <h2>Hemodynamics & ECG</h2>
      <div class="grid4">
        ${field("HR (bpm)", "baseHr", "number")}
        ${field("SpO2 Rate", "spRate", "number")}
        ${selField("ECG Rhythm", "rhythm", RHYTHMS)}
        ${selField("SpO2 Signal", "spSignal", [{v:3,t:"3 (***)"},{v:2,t:"2 (**)"},{v:1,t:"1 (*)"},{v:0,t:"0 (---)"}])}
        ${field("SBP", "baseAbpS", "number")}
        ${field("DBP", "baseAbpD", "number")}
        ${field("MAP", "baseAbpM", "number")}
        ${field("CO (L/min)", "cardiacOutput", "number", "step='0.1'")}
        ${field("ST II", "stSegII", "number", "step='0.1'")}
        ${field("ST V5", "stSegV5", "number", "step='0.1'")}
        ${field("CVP", "cvp", "number")}
        ${field("PAWP", "papW", "number")}
        ${field("PAP Sys", "papS", "number")}
        ${field("PAP Dia", "papD", "number")}
        ${field("PAP Mean", "papM", "number")}
      </div>
    </div>

    <div class="card">
      <h2>Airway & Respiratory</h2>
      <div class="grid4">
        ${selField("Airway Status", "airwayStr", AIRWAYS)}
        ${field("Spont RR", "spontRr", "number")}
        ${field("Spont TV (mL)", "spontTv", "number")}
        ${field("Vent PIP", "contPip", "number")}
        ${selField("Laryngoscopy", "laryTubeSuccess", [{v:1,t:"1 - Grade 1 (Success)"},{v:0,t:"0 - Coughing (Fail)"},{v:-1,t:"-1 - Grade 4 (Fail)"},{v:-2,t:"-2 - Esophagus"}])}
        ${field("LMA Works", "lmaSuccessFlag", "checkbox")}
        ${field("Hi CO2 (MH)", "hiCo2ProdFlag", "checkbox")}
        ${selField("Secretions", "sputumAmount", [{v:0,t:"0 - Minimal"},{v:1,t:"1 - Moderate"},{v:2,t:"2 - Copious"}])}
        ${field("Sat @ 20% O2", "sat20", "number")}
        ${field("Sat @ 40% O2", "sat40", "number")}
        ${field("Sat @ 100% O2", "sat100", "number")}
      </div>
    </div>

    <div class="card">
      <h2>Labs, Temp & Bleeding</h2>
      <div class="grid4">
        ${field("Temp (°C)", "temperature", "number", "step='0.1'")}
        ${field("HCT (%)", "hct", "number")}
        ${field("Na+", "sodium", "number")}
        ${field("K+", "basePot", "number", "step='0.1'")}
        ${field("HCO3-", "baseBicarb", "number", "step='0.1'")}
        ${field("Glucose", "glucose", "number")}
        ${field("EBL (mL/min)", "rateEbl", "number")}
        ${field("UO (mL/min)", "rateUo", "number", "step='0.1'")}
      </div>
    </div>

    <div class="card">
      <h2>Physical Exam Messages (Patient Tab)</h2>
      <div class="grid2">
        ${field("Mental Status", "mentalStatusMsg")}
        ${field("Pupils", "pupilsMsg")}
        ${field("Lid Reflex", "lidReflexMsg")}
        ${field("Breath Sounds", "breathSoundsMsg")}
        ${field("Heart Sounds", "heartSoundsMsg")}
        ${field("Pulse", "pulseMsg")}
        ${field("Skin", "skinMsg")}
        ${field("Aspirate CVP", "aspirateCvpMsg")}
      </div>
    </div>
  `;
}

function addTransition() {
  const st = currentCase.states[selIdx];
  if (!st.trans) st.trans = [];
  const fallbackTarget = currentCase.states[Math.min(selIdx + 1, currentCase.states.length - 1)].name;
  st.trans.push({ nextState: fallbackTarget, comment: "Transition triggered. (+100 points)", points: 100, conditions: [{ type: "doa", op: "GT", value: 0.6 }] });
  renderTransitions(); renderStateList(); renderWarnings();
}

function delTransition(ti) {
  currentCase.states[selIdx].trans.splice(ti, 1);
  renderTransitions(); renderStateList(); renderWarnings();
}

function addCond(ti) {
  currentCase.states[selIdx].trans[ti].conditions.push({ type: "time", op: "GT", value: 30 });
  renderTransitions();
}

function delCond(ti, ci) {
  currentCase.states[selIdx].trans[ti].conditions.splice(ci, 1);
  renderTransitions();
}

function changeCondType(ti, ci, newType) {
  const c = { type: newType };
  if (DRUG_CONDS.includes(newType)) { c.drug = "Phenylephrine"; c.op = "GT"; c.value = 50; }
  else if (NUM_CONDS.includes(newType)) { c.op = "GT"; c.value = 1; }
  else { c.value = true; }
  currentCase.states[selIdx].trans[ti].conditions[ci] = c;
  renderTransitions();
}

function renderTransitions() {
  const st = currentCase.states[selIdx];
  document.getElementById("tranStateLabel").textContent = st.name;
  const list = document.getElementById("tranList");
  list.innerHTML = "";
  const stateNames = currentCase.states.map(s => s.name);

  (st.trans || []).forEach((tr, ti) => {
    const card = document.createElement("div");
    card.className = "tran-card";
    const targetOpts = stateNames.map(n => `<option value="${n}" ${tr.nextState === n ? "selected" : ""}>${n}</option>`).join("")
      + (!stateNames.includes(tr.nextState) ? `<option value="${tr.nextState}" selected>⚠ ${tr.nextState} (missing)</option>` : "");

    let condsHtml = (tr.conditions || []).map((c, ci) => {
      const allTypes = [...NUM_CONDS, ...DRUG_CONDS, ...BOOL_CONDS];
      const typeOpts = allTypes.map(t => `<option value="${t}" ${c.type === t ? "selected" : ""}>${t}</option>`).join("");
      let mid = "", right = "";
      if (DRUG_CONDS.includes(c.type)) {
        const drugOpts = DRUGS.map(d => `<option value="${d}" ${c.drug === d ? "selected" : ""}>${d}</option>`).join("");
        const opOpts = ["GT","LT","EQ"].map(o => `<option value="${o}" ${c.op === o ? "selected" : ""}>${o}</option>`).join("");
        return `
          <div style="background:#111317;padding:5px;border-radius:4px;margin-top:5px;">
            <div style="display:grid;grid-template-columns:1fr 1fr 24px;gap:4px;">
              <select onchange="changeCondType(${ti},${ci},this.value)">${typeOpts}</select>
              <select onchange="currentCase.states[selIdx].trans[${ti}].conditions[${ci}].drug=this.value">${drugOpts}</select>
              <button class="small danger" onclick="delCond(${ti},${ci})">×</button>
            </div>
            <div style="display:grid;grid-template-columns:70px 1fr;gap:4px;margin-top:4px;">
              <select onchange="currentCase.states[selIdx].trans[${ti}].conditions[${ci}].op=this.value">${opOpts}</select>
              <input type="number" step="any" value="${c.value}" onchange="currentCase.states[selIdx].trans[${ti}].conditions[${ci}].value=parseFloat(this.value)||0">
            </div>
          </div>`;
      } else if (NUM_CONDS.includes(c.type)) {
        const opOpts = ["GT","LT","EQ"].map(o => `<option value="${o}" ${c.op === o ? "selected" : ""}>${o}</option>`).join("");
        mid = `<select onchange="currentCase.states[selIdx].trans[${ti}].conditions[${ci}].op=this.value">${opOpts}</select>`;
        right = `<input type="number" step="any" value="${c.value}" onchange="currentCase.states[selIdx].trans[${ti}].conditions[${ci}].value=parseFloat(this.value)||0">`;
      } else {
        mid = `<span style="font-size:11px;color:#6b7280;text-align:center;">is</span>`;
        right = `<select onchange="currentCase.states[selIdx].trans[${ti}].conditions[${ci}].value=(this.value==='true')"><option value="true" ${c.value===true?"selected":""}>true</option><option value="false" ${c.value===false?"selected":""}>false</option></select>`;
      }
      return `<div class="cond-row"><select onchange="changeCondType(${ti},${ci},this.value)">${typeOpts}</select>${mid}${right}<button class="small danger" onclick="delCond(${ti},${ci})">×</button></div>`;
    }).join("");

    card.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 80px 26px;gap:6px;align-items:end;">
        <div><label>Next State</label><select onchange="currentCase.states[selIdx].trans[${ti}].nextState=this.value;renderWarnings();">${targetOpts}</select></div>
        <div><label>Points</label><input type="number" value="${tr.points}" onchange="currentCase.states[selIdx].trans[${ti}].points=parseInt(this.value)||0"></div>
        <button class="small danger" style="height:27px;" onclick="delTransition(${ti})">×</button>
      </div>
      <div style="margin-top:6px;"><label>Log Comment</label><input value="${String(tr.comment||"").replace(/"/g,"&quot;")}" onchange="currentCase.states[selIdx].trans[${ti}].comment=this.value"></div>
      <div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:11px;color:#9ca3af;">Conditions (ALL must be true):</span>
        <button class="small" onclick="addCond(${ti})">+ Condition</button>
      </div>
      ${condsHtml}
    `;
    list.appendChild(card);
  });
}

function renderWarnings() {
  const names = new Set(currentCase.states.map(s => s.name));
  const msgs = [];
  currentCase.states.forEach(s => {
    (s.trans || []).forEach(t => {
      if (!names.has(t.nextState)) msgs.push(`State <b>${s.name}</b> has transition to missing state <b>${t.nextState}</b>.`);
    });
  });
  document.getElementById("warnings").innerHTML = msgs.map(m => `<div class="warn">${m}</div>`).join("");
}

function generateJs() {
  syncCase();
  return `CaseData[${caseNum}] = ${JSON.stringify(currentCase, null, 4)};\n`;
}

function openExport() {
  modalMode = "export";
  document.getElementById("modalTitle").textContent = `Anesth6Case${caseNum}.js`;
  document.getElementById("modalHint").innerHTML = `Add to <b>index.html</b> under &lt;!-- case files --&gt;: <code>&lt;script src="cases/Anesth6Case${caseNum}.js" type="text/javascript"&gt;&lt;/script&gt;</code>`;
  document.getElementById("modalText").value = generateJs();
  document.getElementById("modalActionBtn").textContent = "Copy to Clipboard";
  document.getElementById("modal").classList.add("open");
}

function openImport() {
  modalMode = "import";
  document.getElementById("modalTitle").textContent = "Import Case JS";
  document.getElementById("modalHint").textContent = "Paste the contents of any Anesth6Case*.js file below:";
  document.getElementById("modalText").value = "";
  document.getElementById("modalActionBtn").textContent = "Load Case";
  document.getElementById("modal").classList.add("open");
}

function closeModal() { document.getElementById("modal").classList.remove("open"); }

function modalAction() {
  if (modalMode === "export") {
    navigator.clipboard.writeText(document.getElementById("modalText").value);
    document.getElementById("modalActionBtn").textContent = "Copied!";
    setTimeout(() => document.getElementById("modalActionBtn").textContent = "Copy to Clipboard", 1200);
  } else {
    parseImportedJs(document.getElementById("modalText").value);
    closeModal();
  }
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => parseImportedJs(ev.target.result);
  reader.readAsText(file);
  e.target.value = "";
}

function parseImportedJs(code) {
  try {
    const CaseData = [];
    eval(code);
    const idx = CaseData.findIndex(Boolean);
    if (idx === -1) throw new Error("No CaseData[...] found.");
    caseNum = idx;
    currentCase = CaseData[idx];
    currentCase.states = currentCase.states.map(s => Object.assign(defaultState(s.name), s));
    selIdx = 0;
    renderAll();
  } catch (err) {
    alert("Could not parse case file: " + err.message);
  }
}

function downloadCase() {
  const blob = new Blob([generateJs()], { type: "text/javascript" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Anesth6Case${caseNum}.js`;
  a.click();
}

function renderAll() {
  renderCaseMeta();
  renderStateList();
  renderStateEditor();
  renderTransitions();
  renderWarnings();
}

loadTemplate();
</script>
</body>
</html>
